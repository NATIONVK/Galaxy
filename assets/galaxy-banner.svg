<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Project Galaxy AI animated banner</title><desc id="desc">A glowing cosmic galaxy with orbiting rings and the words PROJECT GALAXY AI.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#17245b"/><stop offset=".55" stop-color="#090d24"/><stop offset="1" stop-color="#050711"/></radialGradient>
 <linearGradient id="text" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#9cecff"/><stop offset="1" stop-color="#b9a2ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<g fill="#fff" opacity=".8">
 <circle cx="85" cy="72" r="2"/><circle cx="210" cy="265" r="1.7"/><circle cx="350" cy="52" r="1.5"/><circle cx="980" cy="80" r="2"/><circle cx="1100" cy="250" r="1.6"/><circle cx="850" cy="300" r="1.3"/><circle cx="690" cy="45" r="1.2"/>
</g>
<g transform="translate(600 180)" fill="none" stroke-linecap="round" filter="url(#glow)">
 <ellipse rx="230" ry="75" stroke="#54dfff" stroke-width="2" opacity=".75" transform="rotate(-18)"><animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="32s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="190" ry="58" stroke="#9c7cff" stroke-width="2" opacity=".75" transform="rotate(28)"><animateTransform attributeName="transform" type="rotate" from="28" to="-332" dur="26s" repeatCount="indefinite"/></ellipse>
 <circle r="43" fill="#8cecff" stroke="#d9fbff" stroke-width="2"><animate attributeName="r" values="39;47;39" dur="3s" repeatCount="indefinite"/></circle>
 <circle r="19" fill="#fff" opacity=".95"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <text x="600" y="80" fill="#8beaff" font-size="16" letter-spacing="8">NATIONVK PRESENTS</text>
 <text x="600" y="285" fill="url(#text)" font-size="42" font-weight="700" letter-spacing="5">PROJECT GALAXY AI</text>
 <text x="600" y="320" fill="#aab5d8" font-size="15" letter-spacing="3">YOUR PERSONAL AI UNIVERSE</text>
</g>
</svg>